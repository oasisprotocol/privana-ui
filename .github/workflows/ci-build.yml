# NOTE: This name appears in GitHub's Checks API and in workflow's status badge.
name: ci-build

# Trigger the workflow when:
on:
  # A push occurs to one of the matched branches.
  push:
    branches:
      - master
      - stable/*
  # Or when a pull request event occurs for a pull request against one of the
  # matched branches.
  pull_request:
    branches:
      - master
      - stable/*

jobs:
  build:
    # NOTE: This name appears in GitHub's Checks API.
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: true
      - name: Enable Corepack
        # Must run before setup-node so its yarn cache resolution sees yarn 4.
        # corepack@latest first: Node 25+ no longer bundles corepack
        run: |
          npm install -g corepack@latest
          corepack enable
      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          # Reuse the version pinned by .nvmrc instead of a floating 22.x.
          node-version-file: frontend/.nvmrc
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - name: Install dependencies
        run: yarn install --immutable
        working-directory: frontend
      - name: Set workflow variables
        # Id is needed to access output in a next step.
        id: vars
        run: |
          echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
      - name: Build app
        run: yarn build
        working-directory: frontend
      - name: Upload build artifacts
        # Upload build artifacts on push event.
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: oasis-flex-vaults-${{ steps.vars.outputs.SHORT_SHA }}
          path: frontend/dist
