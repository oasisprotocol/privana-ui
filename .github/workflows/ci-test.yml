# NOTE: This name appears in GitHub's Checks API and in workflow's status badge.
name: ci-test

# Trigger the workflow when:
on:
  # A push occurs to one of the matched branches.
  push:
    branches:
      - master
      - stable/*
  # Or when a pull request event occurs for a pull request against one of the
  # matched branches.
  pull_request:
    branches:
      - master
      - stable/*

# Limit secrets.GITHUB_TOKEN to reading the repository: the checkout of this
# private repo needs it, and nothing here needs more.
permissions:
  contents: read

jobs:
  test:
    # NOTE: This name appears in GitHub's Checks API.
    name: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: true
      - name: Enable Corepack
        # Must run before setup-node so its yarn cache resolution sees yarn 4.
        # corepack@latest first: Node 25+ no longer bundles corepack
        run: |
          npm install -g corepack@latest
          corepack enable
      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          # Reuse the version pinned by .nvmrc instead of a floating 22.x.
          node-version-file: frontend/.nvmrc
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - name: Install dependencies
        run: yarn install --immutable
        working-directory: frontend
      - name: Run tests
        run: yarn test
        working-directory: frontend
