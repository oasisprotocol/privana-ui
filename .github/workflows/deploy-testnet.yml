name: deploy-testnet

on:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: deploy-testnet
  cancel-in-progress: true

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Enable Corepack
        # Must run before setup-node so its yarn cache resolution sees yarn 4.
        # corepack@latest first: Node 25+ no longer bundles corepack
        run: |
          npm install -g corepack@latest
          corepack enable
      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - name: Install dependencies
        run: yarn install --immutable
        working-directory: frontend
      - name: Build app
        run: yarn build
        working-directory: frontend
      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          packageManager: yarn
          workingDirectory: frontend
          # Token with Cloudflare Pages edit permission only generated in Cloudflare dashboard -> Manage Account -> Account API Tokens
          apiToken: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
          # Acquired from Cloudflare dashboard -> Compute > Workers & Pages or dashboard url: https://dash.cloudflare.com/<account-id>/
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Project created via Cloudflare dashboard or CLI command "npx wrangler pages project create <project-name>"
          command: pages deploy ./dist --project-name=privana-ui-testnet --branch=master
