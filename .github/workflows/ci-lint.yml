# NOTE: This name appears in GitHub's Checks API and in workflow's status badge.
name: ci-lint

# Trigger the workflow when:
on:
  # A push occurs to one of the matched branches.
  push:
    branches:
      - master
      - stable/*
  # Or when a pull request event occurs for a pull request against one of the
  # matched branches.
  pull_request:
    branches:
      - master
      - stable/*

jobs:
  lint:
    # NOTE: This name appears in GitHub's Checks API.
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: true
      - name: Enable Corepack
        # Must run before setup-node so its yarn cache resolution sees yarn 4.
        # corepack@latest first: Node 25+ no longer bundles corepack
        run: |
          npm install -g corepack@latest
          corepack enable
      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          # Reuse the version pinned by .nvmrc instead of a floating 22.x.
          node-version-file: frontend/.nvmrc
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - name: Install dependencies
        run: yarn install --immutable
        working-directory: frontend
      - name: Lint documentation
        run: yarn lint-docs
        working-directory: frontend
        # Always run this step so that all linting errors can be seen at once.
        if: always()
      - name: Prettier
        run: yarn prettier-check
        working-directory: frontend
        # Always run this step so that all linting errors can be seen at once.
        if: always()
      - name: ESLint
        # Disallow warnings and always throw errors.
        run: yarn lint --max-warnings 0
        working-directory: frontend
        # Always run this step so that all linting errors can be seen at once.
        if: always()
      - name: Validate TypeScript
        run: yarn checkTs
        working-directory: frontend
        # Always run this step so that all linting errors can be seen at once.
        if: always()
